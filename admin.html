<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de Pedidos | Valera Sport</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        h1, h2, .font-brand { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .icon-touch { transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease; }
        .icon-touch:hover, .icon-touch:active { transform: scale(1.08); }
        .icon-touch:active { transform: scale(0.94); }
    </style>
</head>
<body class="text-slate-300 antialiased min-h-screen">

    <!-- PANTALLA DE CONTRASEÑA -->
    <div id="pantallaLogin" class="min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <span class="text-2xl font-black tracking-wider text-white">VALERA<span class="text-cyan-500">SPORT</span></span>
                <p class="text-xs text-slate-500 uppercase tracking-widest mt-2">Panel de pedidos</p>
            </div>
            <form id="formLogin" class="space-y-4">
                <input type="password" id="inputPassword" placeholder="Contraseña del panel" autocomplete="current-password" class="w-full bg-white/[0.07] border border-white/[0.14] focus:border-cyan-400/50 rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-500 outline-none">
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-black py-3 rounded-xl text-sm uppercase tracking-wider transition">
                    Entrar
                </button>
                <p id="errorLogin" class="hidden text-rose-400 text-xs text-center">Contraseña incorrecta</p>
            </form>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="panelPrincipal" class="hidden max-w-2xl mx-auto px-5 py-8">

        <header class="flex items-center justify-between mb-8">
            <span class="text-xl font-black tracking-wider text-white">VALERA<span class="text-cyan-500">SPORT</span></span>
            <button onclick="cerrarSesion()" class="text-xs text-slate-500 hover:text-white transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir
            </button>
        </header>

        <!-- RESUMEN DEL DÍA -->
        <div class="bg-gradient-to-br from-cyan-950/40 to-purple-950/40 border border-white/[0.1] rounded-2xl p-6 mb-8">
            <p class="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1">Vendido hoy</p>
            <p class="text-4xl font-black text-white" id="totalHoy">$0.00</p>
            <p class="text-sm text-slate-400 mt-1" id="cantidadHoy">0 pedidos aceptados</p>
        </div>

        <!-- REGISTRAR VENTA FÍSICA -->
        <div class="mb-8">
            <button onclick="toggleFormularioFisica()" id="btnToggleFisica" class="w-full bg-white/[0.05] hover:bg-white/[0.08] border border-white/[0.1] rounded-2xl p-4 flex items-center justify-between transition">
                <span class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-store text-purple-400"></i> Registrar venta en tienda física
                </span>
                <i class="fa-solid fa-chevron-down text-slate-500 text-xs" id="iconoToggleFisica"></i>
            </button>

            <div id="formularioFisica" class="hidden mt-3 bg-white/[0.03] border border-white/[0.08] rounded-2xl p-5 space-y-3">
                <div>
                    <label class="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-1.5">Correo del cliente</label>
                    <input type="email" id="fisicaCorreo" placeholder="cliente@correo.com" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 outline-none focus:border-purple-400">
                </div>
                <div>
                    <label class="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-1.5">Producto</label>
                    <input type="text" id="fisicaProducto" placeholder="Nombre del producto" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 outline-none focus:border-purple-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-1.5">Precio</label>
                        <input type="number" step="0.01" id="fisicaPrecio" placeholder="0.00" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 outline-none focus:border-purple-400">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-1.5">Categoría</label>
                        <input type="text" id="fisicaCategoria" placeholder="Damas / Caballeros..." class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white placeholder:text-slate-500 outline-none focus:border-purple-400">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-1.5">Método de pago</label>
                    <select id="fisicaMetodoPago" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white outline-none focus:border-purple-400">
                        <option value="Efectivo en tienda">Efectivo en tienda</option>
                        <option value="Pago Móvil">Pago Móvil</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                </div>
                <button onclick="registrarVentaFisica()" class="icon-touch w-full bg-purple-500 hover:bg-purple-400 text-white font-black py-3 rounded-xl text-sm uppercase tracking-wider transition mt-2">
                    <i class="fa-solid fa-plus mr-1"></i> Registrar venta
                </button>
                <p id="mensajeFisica" class="hidden text-center text-xs font-semibold py-2"></p>
            </div>
        </div>

        <!-- LISTA DE PEDIDOS PENDIENTES -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-white">Pedidos pendientes</h2>
            <div class="flex items-center gap-1">
                <button onclick="cargarTodo()" title="Actualizar" class="icon-touch text-slate-500 hover:text-cyan-400 w-8 h-8 flex items-center justify-center rounded-full">
                    <i class="fa-solid fa-arrows-rotate text-sm"></i>
                </button>
                <button onclick="rechazarTodosPendientes()" title="Rechazar todos los pedidos pendientes" class="icon-touch text-slate-500 hover:text-rose-400 w-8 h-8 flex items-center justify-center rounded-full">
                    <i class="fa-solid fa-trash text-sm"></i>
                </button>
            </div>
        </div>

        <p id="cargando" class="text-sm text-slate-500 text-center py-10">Cargando pedidos...</p>
        <div id="listaPedidos" class="space-y-4"></div>
        <p id="sinPedidos" class="hidden text-sm text-slate-500 text-center py-10">No hay pedidos pendientes por ahora.</p>
    </div>

    <script>
        const PASSWORD_KEY = 'vs_admin_password';

        const formLogin = document.getElementById('formLogin');
        const inputPassword = document.getElementById('inputPassword');
        const errorLogin = document.getElementById('errorLogin');
        const pantallaLogin = document.getElementById('pantallaLogin');
        const panelPrincipal = document.getElementById('panelPrincipal');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const clave = inputPassword.value.trim();
            if (!clave) return;

            errorLogin.classList.add('hidden');
            const valida = await probarPassword(clave);
            if (valida) {
                sessionStorage.setItem(PASSWORD_KEY, clave);
                mostrarPanel();
            } else {
                errorLogin.classList.remove('hidden');
            }
        });

        async function probarPassword(clave) {
            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: clave, tipo: 'pedidos' })
                });
                return resp.status !== 401;
            } catch (e) {
                return false;
            }
        }

        function mostrarPanel() {
            pantallaLogin.classList.add('hidden');
            panelPrincipal.classList.remove('hidden');
            cargarTodo();
        }

        function cerrarSesion() {
            sessionStorage.removeItem(PASSWORD_KEY);
            panelPrincipal.classList.add('hidden');
            pantallaLogin.classList.remove('hidden');
            inputPassword.value = '';
        }

        function obtenerPassword() {
            return sessionStorage.getItem(PASSWORD_KEY) || '';
        }

        async function cargarTodo() {
            await Promise.all([cargarResumen(), cargarPedidos()]);
        }

        async function cargarResumen() {
            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: obtenerPassword(), tipo: 'resumen' })
                });
                const datos = await resp.json();
                if (datos.ok) {
                    document.getElementById('totalHoy').textContent = '$' + Number(datos.resumen.totalHoy).toFixed(2);
                    document.getElementById('cantidadHoy').textContent = datos.resumen.cantidadHoy + ' pedidos aceptados';
                }
            } catch (e) {
                console.error('Error cargando resumen:', e);
            }
        }

        async function cargarPedidos() {
            const cargando = document.getElementById('cargando');
            const lista = document.getElementById('listaPedidos');
            const sinPedidos = document.getElementById('sinPedidos');

            cargando.classList.remove('hidden');
            sinPedidos.classList.add('hidden');

            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: obtenerPassword(), tipo: 'pedidos' })
                });
                const datos = await resp.json();
                cargando.classList.add('hidden');

                if (!datos.ok) {
                    lista.innerHTML = '<p class="text-rose-400 text-sm text-center py-6">' + escapeHTML(datos.error || 'Error al cargar pedidos') + '</p>';
                    return;
                }

                if (!datos.pedidos.length) {
                    lista.innerHTML = '';
                    sinPedidos.classList.remove('hidden');
                    return;
                }

                lista.innerHTML = datos.pedidos.map(tarjetaPedido).join('');
            } catch (e) {
                cargando.classList.add('hidden');
                lista.innerHTML = '<p class="text-rose-400 text-sm text-center py-6">No se pudo conectar con el servidor.</p>';
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function tarjetaPedido(p) {
            const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-VE', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' }) : '';
            const precio = Number(p.precio || 0).toFixed(2);
            const idAttr = escapeHTML(p.id);
            const metodoPago = escapeHTML(p.metodoPago || 'No especificado');
            const referencia = p.referencia && String(p.referencia).trim() ? escapeHTML(p.referencia) : null;

            return `
                <div class="bg-white/[0.05] border border-white/[0.1] rounded-2xl p-5" id="pedido-${idAttr}" data-id="${idAttr}">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[10px] font-bold text-cyan-400/80 uppercase tracking-widest block mb-1">${escapeHTML(p.categoria || 'Variados')}</span>
                            <h3 class="text-white font-bold">${escapeHTML(p.producto)}</h3>
                            <p class="text-xs text-slate-500 mt-1">${escapeHTML(fecha)}</p>
                        </div>
                        <span class="text-xl font-black text-white">$${precio}</span>
                    </div>
                    <div class="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-3 mb-4">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500 uppercase font-bold">Método de pago:</span>
                            <span class="text-slate-200 font-semibold">${metodoPago}</span>
                        </div>
                        ${referencia ? `
                        <div class="flex justify-between items-center text-xs mt-2">
                            <span class="text-slate-500 uppercase font-bold">Referencia:</span>
                            <span class="text-slate-200 font-mono">${referencia}</span>
                        </div>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button data-accion="rechazar" class="bg-white/5 hover:bg-rose-500/20 border border-white/10 hover:border-rose-500/40 text-slate-300 hover:text-rose-400 font-bold py-3 rounded-xl text-sm transition">
                            <i class="fa-solid fa-xmark mr-1"></i> Rechazar
                        </button>
                        <button data-accion="aceptar" class="bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black py-3 rounded-xl text-sm transition">
                            <i class="fa-solid fa-check mr-1"></i> Aceptar
                        </button>
                    </div>
                </div>
            `;
        }

        document.getElementById('listaPedidos').addEventListener('click', (e) => {
            const boton = e.target.closest('button[data-accion]');
            if (!boton) return;
            const tarjeta = boton.closest('[data-id]');
            if (!tarjeta) return;
            responder(tarjeta.dataset.id, boton.dataset.accion);
        });

        async function responder(id, accion) {
            const tarjeta = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
            if (tarjeta) tarjeta.style.opacity = '0.4';

            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: obtenerPassword(), accion, id })
                });
                const datos = await resp.json();

                if (!datos.ok) {
                    alert('Error: ' + (datos.error || 'no se pudo procesar el pedido'));
                    if (tarjeta) tarjeta.style.opacity = '1';
                    return;
                }

                if (tarjeta) tarjeta.remove();
                cargarResumen();

                const lista = document.getElementById('listaPedidos');
                if (!lista.children.length) {
                    document.getElementById('sinPedidos').classList.remove('hidden');
                }
            } catch (e) {
                alert('No se pudo conectar con el servidor.');
                if (tarjeta) tarjeta.style.opacity = '1';
            }
        }

        async function rechazarTodosPendientes() {
            const confirmar = confirm('¿Seguro que quieres rechazar TODOS los pedidos pendientes? Quedan guardados como "rechazados" en el Sheet, no se borra nada, pero esta acción no se puede deshacer desde aquí.');
            if (!confirmar) return;

            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: obtenerPassword(), accion: 'rechazar_todos' })
                });
                const datos = await resp.json();

                if (!datos.ok) {
                    alert('Error: ' + (datos.error || 'no se pudo procesar'));
                    return;
                }

                cargarTodo();
            } catch (e) {
                alert('No se pudo conectar con el servidor.');
            }
        }

        // ---------- REGISTRAR VENTA FÍSICA ----------

        function toggleFormularioFisica() {
            const form = document.getElementById('formularioFisica');
            const icono = document.getElementById('iconoToggleFisica');
            form.classList.toggle('hidden');
            icono.classList.toggle('fa-chevron-down');
            icono.classList.toggle('fa-chevron-up');
        }

        async function registrarVentaFisica() {
            const correo = document.getElementById('fisicaCorreo').value.trim();
            const producto = document.getElementById('fisicaProducto').value.trim();
            const precio = document.getElementById('fisicaPrecio').value.trim();
            const categoria = document.getElementById('fisicaCategoria').value.trim();
            const metodoPago = document.getElementById('fisicaMetodoPago').value;

            const mensaje = document.getElementById('mensajeFisica');
            mensaje.classList.add('hidden');

            if (!correo || !producto || !precio) {
                mensaje.textContent = 'Completa correo, producto y precio.';
                mensaje.className = 'block text-center text-xs font-semibold py-2 text-rose-400';
                return;
            }

            try {
                const resp = await fetch('/.netlify/functions/admin-pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: obtenerPassword(),
                        accion: 'ventaFisica',
                        nombre: producto,
                        precio: precio,
                        categoria: categoria,
                        metodoPago: metodoPago,
                        correoCliente: correo
                    })
                });
                const datos = await resp.json();

                if (!datos.ok) {
                    mensaje.textContent = 'Error: ' + (datos.error || 'no se pudo registrar');
                    mensaje.className = 'block text-center text-xs font-semibold py-2 text-rose-400';
                    return;
                }

                mensaje.textContent = '✅ Venta registrada correctamente.';
                mensaje.className = 'block text-center text-xs font-semibold py-2 text-emerald-400';

                document.getElementById('fisicaCorreo').value = '';
                document.getElementById('fisicaProducto').value = '';
                document.getElementById('fisicaPrecio').value = '';
                document.getElementById('fisicaCategoria').value = '';

                cargarResumen();
            } catch (e) {
                mensaje.textContent = 'No se pudo conectar con el servidor.';
                mensaje.className = 'block text-center text-xs font-semibold py-2 text-rose-400';
            }
        }

        (function iniciar() {
            const claveGuardada = obtenerPassword();
            if (claveGuardada) {
                mostrarPanel();
            }
        })();

        setInterval(() => {
            if (!panelPrincipal.classList.contains('hidden')) cargarTodo();
        }, 30000);
    </script>
</body>
</html>
